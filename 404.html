<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10312b">
  <title>Sayfa Bulunamadı — Bayel Yapı</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/pusula.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10312b;
      color: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 34rem; }
    .star {
      width: 2.6rem;
      height: 2.6rem;
      margin: 0 auto 2.2rem;
      color: #cee7ef;
    }
    h1 {
      font-family: "Iowan Old Style", Baskerville, "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(5.5rem, 18vw, 9rem);
      line-height: 1;
      letter-spacing: .02em;
    }
    .sub {
      font-family: "Iowan Old Style", Baskerville, "Times New Roman", serif;
      font-size: clamp(1.35rem, 4vw, 1.7rem);
      margin-top: 1rem;
    }
    p.txt {
      font-size: .95rem;
      line-height: 1.6;
      color: #cee7ef;
      margin-top: 1.1rem;
    }
    a.home {
      display: inline-block;
      margin-top: 2.4rem;
      padding: .85rem 1.9rem;
      border: 1px solid rgba(206, 231, 239, .55);
      border-radius: 999px;
      color: #ffffff;
      text-decoration: none;
      font-size: .95rem;
      letter-spacing: .04em;
      transition: background-color 220ms cubic-bezier(.22,1,.36,1), color 220ms cubic-bezier(.22,1,.36,1);
    }
    a.home:hover, a.home:focus-visible { background: #cee7ef; color: #10312b; }
  </style>
</head>
<body>
  <main class="wrap">
    <svg class="star" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 0c.9 6.5 4.6 10.2 12 12-7.4 1.8-11.1 5.5-12 12-.9-6.5-4.6-10.2-12-12C7.4 10.2 11.1 6.5 12 0Z" fill="currentColor"/>
    </svg>
    <h1>404</h1>
    <p class="sub">Sayfa bulunamadı</p>
    <p class="txt">Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir. Pusulayı ana sayfaya çevirmenizi öneririz.</p>
    <a class="home" href="https://bayelyapi.com/">Ana sayfaya dön</a>
  </main>
</body>
</html>
